  canbus_slave:
    image: hinpak/ros2:built-1104-debug
    container_name: canbus_slave_container
    privileged: true
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev:rw
      - /sys:/sys:rw
    environment:
      - DISPLAY=unix:1
      - ROS_LOCALHOST_ONLY=0
      - ROS_DOMAIN_ID=42
    network_mode: "host"
    networks:
      - ros2_network
    # depends_on:
    #   - ros2_socketcan
    command: > 
      bash -c "
      source /ros2_ws/install/setup.bash && 
      colcon build --packages-select ros2_socketcan &&
      colcon build --packages-select canbus_slave
      "

  uart_slave:
    image: hinpak/ros2:built-1104-debug
    container_name: uart_slave_container
    privileged: true
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev:rw
      - /sys:/sys:rw
    environment:
      - DISPLAY=unix:1
      - ROS_LOCALHOST_ONLY=0
      - ROS_DOMAIN_ID=42
    network_mode: "host"
    networks:
      - ros2_network
    depends_on:
      - canbus_slave
    command: > 
      bash -c "
      source /ros2_ws/install/setup.bash && 
      colcon build --packages-select canbus_slave &&
      colcon build --packages-select uart_slave &&
      ros2 launch uart_slave uart_slave.launch.py
      "

  imu_process:
    image: hinpak/ros2:built-1104-debug
    container_name: imu_process_container
    privileged: true
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev:rw
      - /sys:/sys:rw
    environment:
      - DISPLAY=unix:1
      - ROS_LOCALHOST_ONLY=0
      - ROS_DOMAIN_ID=42
    network_mode: "host"
    networks:
      - ros2_network
    depends_on:
      - canbus_slave
    command: > 
      bash -c "
      source /ros2_ws/install/setup.bash && 
      colcon build --packages-select canbus_slave &&
      colcon build --packages-select imu_process &&
      ros2 launch imu_process imu_processor.launch.py
      "

