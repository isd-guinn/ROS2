# A ROS2 network with multiple nodes

version: '1'

services:
  serial_imu:
    image: hinpak/ros2:built-1024-maintain
    container_name: serial_imu_container
    privileged: true
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev:rw
      - /sys:/sys:rw
    environment:
      - DISPLAY=unix:1
      - ROS_LOCALHOST_ONLY=0
      - ROS_DOMAIN_ID=42
    networks:
      - ros2_network
    command: > 
      bash -c "
      source /ros2_ws/install/setup.bash && 
      colcon build --packages-select serial_imu &&
      colcon build --packages-select uart_slave &&
      ros2 launch serial_imu imu_spec_msg.launch.py
      "

  uart_slave:
    image: hinpak/ros2:built-1024-maintain
    container_name: uart_slave_container
    privileged: true
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev:rw
      - /sys:/sys:rw
    environment:
      - DISPLAY=unix:1
      - ROS_LOCALHOST_ONLY=0
      - ROS_DOMAIN_ID=42
    networks:
      - ros2_network
    depends_on:
      - serial_imu
    command: > 
      bash -c "
      source /ros2_ws/install/setup.bash && 
      colcon build --packages-select serial_imu &&
      colcon build --packages-select uart_slave &&
      ros2 launch uart_slave uart_slave.launch.py
      "

networks:
  ros2_network:
    driver: bridge